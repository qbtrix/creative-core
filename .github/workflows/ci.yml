# CI: runs scripts/ci (no-crash lint, swift build, swift test) on Linux and
# macOS, plus the fast-lane decision tests. The main ruleset requires the job
# names "Linux" and "macOS" and the fast lane reads this workflow ("CI"), so
# keep the names stable. merge_group runs CI on merge-queue groups. The fast
# lane enqueues with GITHUB_TOKEN, which fires no merge_group event, so it
# starts CI on its groups with workflow_dispatch instead.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its superseded run. Runs on main and on
# merge-queue groups (one commit each) always finish: the queue waits on them.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    # Official image; 6.3.3-noble is Ubuntu 24.04, the same OS as the cloud agents.
    container: swift:6.3.3-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - { uses: actions/setup-node@v4, with: { node-version: 22 } } # jscpd duplicate check; the swift image has no node
      # CoreCatalog's GRDB links the system SQLite; the image has the runtime, not the headers.
      - run: apt-get update -q && apt-get install -y -q --no-install-recommends libsqlite3-dev
      - run: swift --version
      - run: scripts/ci

  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: scripts/ci

  fast-lane-tests:
    name: Fast lane tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash Tests/fast_lane/test_fast_lane.sh
