# Mutation: the full scripts/mutate sweep. Every entry in Tests/mutations/*.json
# plants its bug and must be caught by its tests. Runs nightly on the default
# branch (dev), on a person's push to main (a hotfix; promotions push with
# GITHUB_TOKEN and fire nothing), and on demand. It is a separate workflow from
# CI on purpose: promotion to main waits for CI, and a sweep takes far longer.
# So a red sweep marks its commit but holds nothing; the "Mutation" job in
# ci.yml, over the commits main has not taken yet, is the blocking check.
name: Mutation

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    name: Mutation sweep
    runs-on: ubuntu-latest
    container: swift:6.3.3-noble
    timeout-minutes: 120
    steps:
      - run: apt-get update -q && apt-get install -y -q --no-install-recommends libsqlite3-dev python3 git
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v4
        with:
          path: .build
          key: mutation-swift-6.3.3-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: mutation-swift-6.3.3-${{ hashFiles('Package.resolved') }}-
      - run: python3 scripts/mutate --run
