# Fast lane: put small, green, allowlisted PRs labelled `fast-lane` into the
# merge queue on main, which tests and squash-merges them. All logic lives in
# scripts/fast-lane.sh; agent rules in CLAUDE.md.
#
# Safety: this workflow never checks out or runs PR code. It checks out only
# scripts/fast-lane.sh from the trusted main branch and talks to the GitHub API.
# workflow_run fires from the copy of this file on the default branch (main),
# so that trigger starts working once this file reaches main.
name: Fast Lane

on:
  pull_request_target:
    types: [labeled, synchronize, ready_for_review]
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
  # Heartbeat: GITHUB_TOKEN events start no workflows, so nothing else notices
  # a queue group the lane enqueued that needs its CI dispatched (after a group
  # fails, the queue rebuilds the ones behind it), or a fast-lane PR the queue
  # merged whose issues need closing. A sweep every 5 minutes. Free on a public repo.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to evaluate (empty = every open fast-lane PR)
        required: false

permissions:
  issues: write
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: write  # dispatch CI on merge-queue groups

concurrency:
  group: fast-lane-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || inputs.pr || github.run_id }}
  cancel-in-progress: false

jobs:
  fast-lane:
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.action == 'labeled' && github.event.label.name == 'fast-lane') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'fast-lane'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/fast-lane.sh
          sparse-checkout-cone-mode: false
      - name: Evaluate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          PR_INPUT: ${{ inputs.pr }}
        run: |
          case "$EVENT" in
            pull_request_target) bash scripts/fast-lane.sh "$PR" ;;
            workflow_run) bash scripts/fast-lane.sh --sha "$SHA" ;;
            *) bash scripts/fast-lane.sh ${PR_INPUT:+"$PR_INPUT"} ;;
          esac
