<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="base" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff0000"/><stop offset="1" stop-color="#0000ff"/>
    </linearGradient>
    <linearGradient id="child" href="#base" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="0"/>
    <radialGradient id="glow" xlink:href="#base" gradientUnits="userSpaceOnUse" cx="50" cy="50" r="10" gradientTransform="translate(10,0)"/>
    <clipPath id="clip"><rect x="0" y="0" width="50" height="50"/></clipPath>
  </defs>
  <rect width="100" height="100" fill="url(#child)"/>
  <circle cx="50" cy="50" r="20" fill="url(#glow)" clip-path="url(#clip)"/>
  <text x="10" y="20" font-family="Serif" font-size="12" fill="#ff0000">Hi &amp; bye</text>
</svg>
